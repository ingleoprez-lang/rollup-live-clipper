<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RollupTV Clipper</title>

  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #141414;
      padding: 40px;
      border-radius: 16px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 22px;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      resize: none;
      margin-bottom: 16px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.8;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>RollupTV Clipper</h1>

    <textarea id="note" placeholder="Write clip note..."></textarea>

    <button onclick="markClip()">Mark Clip</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    function getEasternTime() {
      const now = new Date();

      const optionsDate = {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      };

      const optionsTime = {
        timeZone: "America/New_York",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };

      const date = new Intl.DateTimeFormat("en-US", optionsDate).format(now);
      const time = new Intl.DateTimeFormat("en-US", optionsTime).format(now);

      return { date, time };
    }

    function markClip() {
      const note = document.getElementById("note").value.trim();
      const status = document.getElementById("status");

      if (!note) {
        status.textContent = "Write something first.";
        return;
      }

      const eastern = getEasternTime();

      fetch("https://script.google.com/macros/s/AKfycbwYghSqYITZPtP8PU-7DTLKhWoO3flrfeG1cmu0duqvi4xK-rjdQuA39mcLV2IpO6xLLw/exec", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `date=${encodeURIComponent(eastern.date)}&time=${encodeURIComponent(eastern.time)}&note=${encodeURIComponent(note)}`
      })
      .then(response => response.text())
      .then(text => {
        if (text.includes("OK")) {
          status.textContent = "Clip marked successfully.";
          document.getElementById("note").value = "";
        } else {
          status.textContent = text;
        }
      })
      .catch(() => {
        status.textContent = "Something went wrong.";
      });
    }
  </script>

</body>
</html>
